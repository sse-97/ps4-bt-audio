name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version strings
        run: scripts/check-version.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: ps4-bt-audio-build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build payload and PKG
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src
          ps4-bt-audio-build make dist host-ui

      - name: Render a UI scene with the PC harness
        run: |
          printf 'online=1\nlink=0\n' > build/scene.txt
          build/host_ui build/scene.txt build/scene.ppm
          test -s build/scene.ppm

      - name: Show checksums
        run: |
          docker run --rm ps4-bt-audio-build cat /opt/openorbis.sha256
          cat build/dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ps4-bt-audio-${{ github.sha }}
          path: build/dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps4-bt-audio-${{ github.sha }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "Bluetooth Audio ${GITHUB_REF_NAME#v}" --generate-notes --draft
